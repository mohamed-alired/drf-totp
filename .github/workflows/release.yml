name: Release

# Runs after CI succeeds on main. Publishes the package version from
# src/drf_totp/__init__.py to PyPI (skipped when that version already exists)
# and creates or updates the matching GitHub release, as the earlier
# push-to-main workflows did. Uses the PYPI_API_TOKEN repository secret.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Read package version
        run: |
          VERSION=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/drf_totp/__init__.py)
          echo "Package version: $VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build package
        run: python -m build && twine check dist/*

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if curl -fsSL "https://pypi.org/pypi/drf-totp/$VERSION/json" > /dev/null 2>&1; then
            echo "Version $VERSION already exists on PyPI. Skipping upload."
          else
            twine upload --skip-existing dist/*
          fi

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v ver="$VERSION" '
            /^## \[/ { if (found) exit; if (index($0, "[" ver "]")) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "Automated release for version $VERSION" > notes.md; fi
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release v$VERSION already exists. Updating..."
            gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" \
              --title "Release $VERSION" --notes-file notes.md
          else
            echo "Creating release v$VERSION..."
            gh release create "v$VERSION" dist/* --repo "$GITHUB_REPOSITORY" \
              --target "${{ github.event.workflow_run.head_sha }}" \
              --title "Release $VERSION" --notes-file notes.md
          fi
